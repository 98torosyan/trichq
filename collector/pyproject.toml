[project]
name = "trichq-collector"
version = "0.1.0"
description = "Թռիչք: fare collector, deal scorer and price-watch notifier"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "tenacity==9.0.0",
  "structlog==24.4.0",
  "fast-flights==3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "respx==0.22.0",
  "ruff==0.8.4",
]

[project.scripts]
trichq = "trichq.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trichq*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF003"]   # Armenian text in strings/comments is intentional
