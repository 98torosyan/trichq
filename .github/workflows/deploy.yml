name: Deploy

# Runs after every push to main (and on demand). Needs these repository secrets:
#   TELEGRAM_BOT_TOKEN, BOT_WEBHOOK_SECRET, ALLOWED_USER_IDS, ADMIN_CHAT_ID,
#   TRAVELPAYOUTS_TOKEN, TRAVELPAYOUTS_MARKER (optional),
#   TURSO_URL, TURSO_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   ORACLE_HOST, ORACLE_SSH_KEY, optionally ORACLE_HOST_KEY (pinned SSH host key line).
# Optional repository *variable* (not secret) WEBAPP_URL for a custom domain; default is the workers.dev URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  app:
    name: Database, mini app, API and bot
    runs-on: ubuntu-24.04
    outputs:
      webapp_url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: collector/pyproject.toml }
      - name: Install collector
        run: pip install ./collector
      - name: Apply database migrations
        working-directory: collector
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
        run: python -m trichq migrate
      - name: Refresh reference data (Armenian names, airlines, visa rules)
        working-directory: collector
        run: python -m trichq reference --out ../webapp/public/ref || echo "::warning::reference refresh failed, keeping the committed copy"

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build mini app
        working-directory: webapp
        run: npm ci && npm run build
      - name: Deploy Worker (API, bot and static mini app)
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Resolve public URL
        id: url
        env:
          CUSTOM: ${{ vars.WEBAPP_URL }}
          DEPLOYED: ${{ steps.deploy.outputs.url }}
        run: |
          url="${CUSTOM:-$DEPLOYED}"
          if [ -z "$url" ]; then
            echo "::error::No public URL. Open Workers & Pages in Cloudflare once to create your workers.dev subdomain, or set the WEBAPP_URL variable."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Upload Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          S_TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          S_TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          S_TURSO_URL: ${{ secrets.TURSO_URL }}
          S_TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          S_ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          S_ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          S_WEBAPP_URL: ${{ steps.url.outputs.url }}
        run: |
          umask 077
          node -e '
            const out = {};
            for (const [k, v] of Object.entries(process.env)) if (k.startsWith("S_") && v.trim()) out[k.slice(2)] = v.trim();  // pasted secrets often carry tabs/spaces
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
      - name: Configure Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          WEBAPP_URL: ${{ steps.url.outputs.url }}
        run: node scripts/setup-telegram.mjs

  collector:
    name: Collector on Oracle Cloud
    runs-on: ubuntu-24.04
    needs: app
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST: ${{ secrets.ORACLE_HOST }}
          HOST_KEY: ${{ secrets.ORACLE_HOST_KEY }}
        run: |
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')   # pasted secrets often carry tabs/spaces
          echo "ORACLE_IP=$HOST" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          # Windows Notepad copies CRLF line endings; OpenSSH rejects them.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          if [ -n "$HOST_KEY" ]; then
            printf '%s %s\n' "$HOST" "$HOST_KEY" >> ~/.ssh/known_hosts   # pinned: safest
          else
            ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts              # trust on first use
          fi
      - name: Copy code
        run: |
          HOST="$ORACLE_IP"
          # Diagnose the usual first-run problems and surface them as annotations (visible without logs).
          ssh-keygen -y -f ~/.ssh/oracle >/dev/null 2>&1 \
            || { echo "::error::ORACLE_SSH_KEY is not a valid private key (paste the whole .key file, not .pub)"; exit 1; }
          grep -q "$HOST" ~/.ssh/known_hosts \
            || { echo "::error::Cannot reach $HOST:22 (wrong ORACLE_HOST, instance stopped, or port 22 closed)"; exit 1; }
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=20 "ubuntu@$HOST" true \
            || { echo "::error::SSH login as ubuntu@$HOST refused: the key does not match this instance"; exit 1; }
          SSH="ssh -i ~/.ssh/oracle -o ServerAliveInterval=30"
          scp -i ~/.ssh/oracle deploy/bootstrap-oracle.sh "ubuntu@$HOST:/tmp/bootstrap-oracle.sh"
          $SSH "ubuntu@$HOST" 'bash /tmp/bootstrap-oracle.sh' || { echo "::error::bootstrap-oracle.sh failed on the VM"; exit 1; }
          rsync -az --delete -e "$SSH" collector db "ubuntu@$HOST:/opt/trichq/src/"
          scp -i ~/.ssh/oracle deploy/docker-compose.yml "ubuntu@$HOST:/opt/trichq/docker-compose.yml"
      - name: Write .env and (re)start
        env:
          ENV_FILE: |
            TRAVELPAYOUTS_TOKEN=${{ secrets.TRAVELPAYOUTS_TOKEN }}
            TRAVELPAYOUTS_MARKER=${{ secrets.TRAVELPAYOUTS_MARKER }}
            TURSO_URL=${{ secrets.TURSO_URL }}
            TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            ADMIN_CHAT_ID=${{ secrets.ADMIN_CHAT_ID }}
            WEBAPP_URL=${{ needs.app.outputs.webapp_url }}
            ORIGINS=EVN,LWN,TBS,KUT
            TP_MARKETS=ru
        run: |
          HOST="$ORACLE_IP"
          printf '%s\n' "$ENV_FILE" | sed -E 's/=[[:space:]]+/=/; s/[[:space:]]+$//' \
            | ssh -i ~/.ssh/oracle "ubuntu@$HOST" 'umask 077; cat > /opt/trichq/.env'
          ssh -i ~/.ssh/oracle "ubuntu@$HOST" 'cd /opt/trichq && sudo docker compose up -d --build --remove-orphans && sudo docker image prune -f >/dev/null && sudo docker compose ps'
